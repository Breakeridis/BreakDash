name: Build BreakDash

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional release tag, e.g. v1.0.0; leave blank for development APKs'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: breakdash-${{ github.workflow }}-${{ inputs.release_version || github.ref }}
  cancel-in-progress: ${{ inputs.release_version == '' && !startsWith(github.ref, 'refs/tags/') }}

env:
  BREAKDASH_REPOSITORY: ${{ github.repository }}

jobs:
  verify:
    name: Checks and test APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, lint, and run JVM tests on GitHub
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:lintRelease :app:assembleRelease
      - name: Name APKs and check native architectures
        shell: bash
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a; do
            artifact="BreakDash-debug-${abi}.apk"
            cp "app/build/outputs/apk/debug/app-${abi}-debug.apk" "$artifact"
            native_abis=$(unzip -Z -1 "$artifact" | awk -F/ '/^lib\/[^/]+\/.*\.so$/ {print $2}' | sort -u)
            if [[ "$native_abis" != "$abi" ]]; then
              echo "Unexpected native libraries in $artifact: $native_abis"; exit 1
            fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$artifact"
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BreakDash-debug-armeabi-v7a
          path: BreakDash-debug-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BreakDash-debug-arm64-v8a
          path: BreakDash-debug-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: BreakDash-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Verify diagnostics receiver (GitHub only)
        run: node --test backend/receiver.test.mjs

  release:
    name: Signed release
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      BREAKDASH_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
      BREAKDASH_DIAGNOSTICS_URL: ${{ vars.BREAKDASH_DIAGNOSTICS_URL }}
      BREAKDASH_DIAGNOSTICS_PUBLIC_KEY: ${{ vars.BREAKDASH_DIAGNOSTICS_PUBLIC_KEY }}
      BREAKDASH_KEYSTORE_PASSWORD: ${{ secrets.BREAKDASH_KEYSTORE_PASSWORD }}
      BREAKDASH_KEY_ALIAS: ${{ secrets.BREAKDASH_KEY_ALIAS }}
      BREAKDASH_KEY_PASSWORD: ${{ secrets.BREAKDASH_KEY_PASSWORD }}
      BREAKDASH_KEYSTORE_TYPE: ${{ vars.BREAKDASH_KEYSTORE_TYPE || 'PKCS12' }}
      BREAKDASH_SIGNER_SHA256: ${{ vars.BREAKDASH_SIGNER_SHA256 }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signing key and tag version
        env:
          KEYSTORE_BASE64: ${{ secrets.BREAKDASH_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BREAKDASH_RELEASE_TAG" =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo 'Release tags must look like v1.0.0'; exit 1
          fi
          if [[ -z "$KEYSTORE_BASE64" || -z "$BREAKDASH_KEYSTORE_PASSWORD" || -z "$BREAKDASH_KEY_ALIAS" || -z "$BREAKDASH_KEY_PASSWORD" ]]; then
            echo 'Configure the four BREAKDASH signing secrets before creating a release tag.'; exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/breakdash.jks"
          key_info=$(keytool -J-Duser.language=en -J-Duser.country=US -list -v -keystore "$RUNNER_TEMP/breakdash.jks" -storetype "$BREAKDASH_KEYSTORE_TYPE" -storepass:env BREAKDASH_KEYSTORE_PASSWORD)
          printf '%s\n' "$key_info"
          if ! keytool -list -keystore "$RUNNER_TEMP/breakdash.jks" -storetype "$BREAKDASH_KEYSTORE_TYPE" -alias "$BREAKDASH_KEY_ALIAS" -storepass:env BREAKDASH_KEYSTORE_PASSWORD > /dev/null 2>&1; then
            exported_alias=$(printf '%s\n' "$key_info" | awk '/^Alias name: / {alias=substr($0,13)} /^Entry type: PrivateKeyEntry/ {print alias}')
            if [[ -z "$exported_alias" || "$exported_alias" == *$'\n'* ]]; then
              echo 'Configured alias is absent and the keystore does not have exactly one private key.'; exit 1
            fi
            echo 'Using the single private-key alias from the exported keystore.'
            echo "BREAKDASH_KEY_ALIAS=$exported_alias" >> "$GITHUB_ENV"
          fi
          echo "BREAKDASH_KEYSTORE_PATH=$RUNNER_TEMP/breakdash.jks" >> "$GITHUB_ENV"
          echo "BREAKDASH_VERSION=${BREAKDASH_RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build signed and optimized APK
        run: gradle --no-daemon --stacktrace :app:lintRelease :app:assembleRelease
      - name: Verify and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a; do
            artifact="BreakDash-${BREAKDASH_RELEASE_TAG}-${abi}.apk"
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "$artifact"
            verification=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$artifact")
            printf '%s\n' "$verification"
            actual=$(printf '%s\n' "$verification" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}')
            expected=$(printf '%s' "$BREAKDASH_SIGNER_SHA256" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
            if [[ -z "$expected" || "$actual" != "$expected" ]]; then
              echo "APK signer does not match the configured BREAKDASH_SIGNER_SHA256"; exit 1
            fi
            sha256sum "$artifact" > "$artifact.sha256"
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BreakDash-signed-release
          path: |
            BreakDash-*.apk
            BreakDash-*.sha256
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=("$BREAKDASH_RELEASE_TAG" BreakDash-*.apk BreakDash-*.sha256 --title "BreakDash $BREAKDASH_RELEASE_TAG")
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BREAKDASH_RELEASE_TAG" > /dev/null 2>&1; then
            tagged_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BREAKDASH_RELEASE_TAG" --jq .sha)
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo 'Existing release tag points at a different source commit.'; exit 1
            fi
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$GITHUB_SHA")
          fi
          notes="docs/releases/${BREAKDASH_RELEASE_TAG}.md"
          if [[ -f "$notes" ]]; then
            gh release create "${release_args[@]}" --notes-file "$notes"
          else
            gh release create "${release_args[@]}" --generate-notes
          fi
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/breakdash.jks"
