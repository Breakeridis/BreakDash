plugins { id 'com.android.application' }

def setting = { String key, String fallback -> System.getenv(key) ?: fallback }
def literal = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n').replace('\r', '') + '"' }
def appVersion = setting('BREAKDASH_VERSION', '1.0.20').replaceFirst('^v', '')
if (!(appVersion ==~ /\d{1,3}\.\d{1,3}\.\d{1,3}/)) throw new GradleException('Use a stable version such as 1.0.0')
def parts = appVersion.split('\\.').collect { it.toInteger() }

android {
    namespace 'com.breakdash.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.breakdash.launcher'
        minSdk 29
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName appVersion
        buildConfigField 'String', 'GITHUB_REPOSITORY', literal(setting('BREAKDASH_REPOSITORY', 'Breakeridis/BreakDash'))
        buildConfigField 'String', 'DIAGNOSTICS_URL', literal(setting('BREAKDASH_DIAGNOSTICS_URL', ''))
        buildConfigField 'String', 'DIAGNOSTICS_PUBLIC_KEY', literal(setting('BREAKDASH_DIAGNOSTICS_PUBLIC_KEY', ''))
        buildConfigField 'String', 'NTFY_TOPIC', literal(setting('BREAKDASH_NTFY_TOPIC', ''))
        buildConfigField 'String', 'FEEDBACK_PUBLIC_KEY', literal(setting('BREAKDASH_FEEDBACK_PUBLIC_KEY', ''))
    }

    // Each standalone APK contains only its device's native libraries.
    // Keep the 32-bit head-unit download small while supporting 64-bit-only phones.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    signingConfigs {
        release {
            if (System.getenv('BREAKDASH_KEYSTORE_PATH')) {
                storeType setting('BREAKDASH_KEYSTORE_TYPE', 'PKCS12')
                storeFile file(System.getenv('BREAKDASH_KEYSTORE_PATH'))
                storePassword System.getenv('BREAKDASH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BREAKDASH_KEY_ALIAS')
                keyPassword System.getenv('BREAKDASH_KEY_PASSWORD')
            }
        }
        debug {
            if (System.getenv('BREAKDASH_DEBUG_KEYSTORE_PATH')) {
                storeFile file(System.getenv('BREAKDASH_DEBUG_KEYSTORE_PATH'))
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }
        release {
            minifyEnabled true
            shrinkResources true
            if (System.getenv('BREAKDASH_KEYSTORE_PATH')) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
    packaging { resources { excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1'] } }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:11.8.2'
    implementation 'androidx.core:core:1.15.0'
    implementation('dev.mobile:dadb:1.2.9') {
        // Upstream accidentally publishes its Graal/JUnit launcher as a runtime dependency.
        exclude group: 'org.graalvm.buildtools', module: 'junit-platform-native'
    }
    testImplementation 'junit:junit:4.13.2'
}

// Synthetic fixture only: cache it with the JVM test outputs for cross-language verification on GitHub.
tasks.withType(Test).configureEach {
    def fixture = layout.buildDirectory.dir('reports/temporary-share')
    environment 'BREAKDASH_TEMPORARY_FIXTURE_DIR', fixture.get().asFile.absolutePath
    outputs.dir(fixture)
}
